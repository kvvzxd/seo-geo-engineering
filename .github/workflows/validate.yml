name: Validate skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 skills/seo-geo-engineering/evals/test_tools.py -q
      - run: python -X utf8 skills/seo-geo-engineering/scripts/seo_geo.py validate skills/seo-geo-engineering/assets/policy.example.json
